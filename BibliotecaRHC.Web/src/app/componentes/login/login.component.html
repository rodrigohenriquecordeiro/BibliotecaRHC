<main class="auth-layout">
  <section class="login-card bg-white">
    
    <img src="assets/logo_biblioteca_rhc.png" 
         alt="logo do Biblioteca RHC" 
         class="brand-logo mx-auto mt-4 d-block">

    <h4 class="text-center mb-4">Login</h4>

    <form action="/login" method="post" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control" id="email" required>
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" [(ngModel)]="senha" name="senha" class="form-control" id="senha" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary mb-3">Login</button>
        <button type="button" class="btn btn-success mb-3" (click)="onLoginCadastro()">Cadastrar</button>
      </div>

      <div class="text-danger text-center mt-3" *ngIf="erroLogin">
        <small>{{ erroLogin }}</small>
      </div>
    </form>
  </section>
</main>
