<section class="ranking-card" [attr.aria-label]="title">
  <h2>{{ title }}</h2>
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th scope="col">{{ firstColumn }}</th>
          <th scope="col">{{ secondColumn }}</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track $index) {
          <tr>
            <td>{{ row.label }}</td>
            <td>{{ row.value }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="2" class="no-data">Nenhum dado encontrado</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
