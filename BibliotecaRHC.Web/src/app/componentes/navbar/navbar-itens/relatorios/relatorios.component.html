<main class="page-shell dashboard-container">
  <app-page-header title="Relatórios" subtitle="Acompanhe os números e tendências da sua biblioteca."></app-page-header>

  <section class="metrics-grid" aria-label="Resumo da biblioteca">
    <button type="button" class="metric-card card-clickable" (click)="abrirMinhaEstante()">
      <span class="metric-label">Total de livros</span>
      <span class="metric-value">{{ totalLivros() }}</span>
    </button>

    <button type="button" class="metric-card card-clickable" (click)="abrirMinhaEstante('sim')">
      <span class="metric-label">Livros lidos</span>
      <span class="metric-value">{{ livrosLidos() }}</span>
    </button>

    <button type="button" class="metric-card card-clickable" (click)="abrirMinhaEstante('não')">
      <span class="metric-label">Livros não lidos</span>
      <span class="metric-value">{{ livrosNaoLidos() }}</span>
    </button>

    <div class="metric-card">
      <span class="metric-label">Total de autores</span>
      <span class="metric-value">{{ totalAutores() }}</span>
    </div>

    <div class="metric-card">
      <span class="metric-label">Total de editoras</span>
      <span class="metric-value">{{ totalEditoras() }}</span>
    </div>

    <button type="button" class="metric-card card-clickable" (click)="abrirProjetosLeitura()">
      <span class="metric-label">Projetos em andamento</span>
      <span class="metric-value">{{ projetosLeituraAndamento() }}</span>
    </button>
  </section>

  <section class="rankings-grid" aria-label="Rankings da biblioteca">
    <app-report-ranking title="Top 10 autores" firstColumn="Autor" secondColumn="Qtd. livros"
      [rows]="autoresRanking()"></app-report-ranking>
    <app-report-ranking title="Top 10 editoras" firstColumn="Editora" secondColumn="Qtd. livros"
      [rows]="editorasRanking()"></app-report-ranking>
    <app-report-ranking title="Top 10 classificações" firstColumn="Classificação" secondColumn="Qtd. livros"
      [rows]="classificacoesRanking()"></app-report-ranking>
    <app-report-ranking title="Top 10 anos de publicação" firstColumn="Ano" secondColumn="Qtd. livros"
      [rows]="anosPublicacaoRanking()"></app-report-ranking>
    <app-report-ranking title="Top 10 anos de aquisição" firstColumn="Ano" secondColumn="Qtd. livros"
      [rows]="anosAquisicaoRanking()"></app-report-ranking>
    <app-report-ranking title="Top 10 livros mais longos" firstColumn="Livro" secondColumn="Páginas"
      [rows]="livrosLongosRanking()"></app-report-ranking>
  </section>
</main>
