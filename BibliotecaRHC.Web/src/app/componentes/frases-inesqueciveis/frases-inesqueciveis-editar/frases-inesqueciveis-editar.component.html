<main class="page-shell">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <app-page-header title="Editar frase" subtitle="Atualize os detalhes desta passagem."></app-page-header>

      <form class="card p-4" [formGroup]="form">

        <div class="mb-3">
          <label for="frase" class="form-label w-100"><strong>Frase Inesquecível</strong></label>
          <textarea class="form-control" id="frase" rows="4" placeholder="Digite a frase..."
            formControlName="frase"></textarea>
        </div>

        <div class="mb-3">
          <label for="autor" class="form-label"><strong>Autor</strong></label>
          <input type="text" class="form-control" id="autor" placeholder="Digite o nome do autor"
            formControlName="autor" />
        </div>

        <div class="mb-3">
          <label for="livro" class="form-label"><strong>Nome do Livro</strong></label>
          <input type="text" class="form-control" id="livro" placeholder="Digite o nome do livro"
            formControlName="nomeDoLivro" />
        </div>

        <div class="d-flex justify-content-end gap-2 mt-4">
          <a class="btn btn-secondary" routerLink="/frases-inesqueciveis-dashboard">Voltar</a>
          <button type="button" class="btn btn-primary" (click)="salvarAlteracoes()">Salvar</button>
        </div>

      </form>

    </div>
  </div>
</main>
